# Test and demo environment. Create the app first:  fly apps create <name>
# then put its name here (or pass -a <name>), set secrets, and run: fly deploy
app = "workato-edi360-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies any new migrations before the new version takes traffic; a failure keeps the old version running
  release_command = "node dist/db/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TZ = "UTC"
  # Set PORTAL_URL and PUBLIC_API_URL to the app's address with: fly secrets set PORTAL_URL=https://<app>.fly.dev PUBLIC_API_URL=https://<app>.fly.dev

[http_service]
  internal_port = 3000
  force_https = true
  # One machine, always on: the consumers and workers (997 rules, ticket sync, alerts) run inside the app
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
